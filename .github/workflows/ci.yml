name: CI

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --locked

  opencode-plugin-test:
    name: OpenCode plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

  linux-filesystem-test:
    name: Linux filesystem tests (${{ matrix.filesystem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - filesystem: btrfs
            packages: btrfs-progs
            required_env: RIFT_REQUIRE_BTRFS_TESTS
          - filesystem: xfs-reflink
            packages: xfsprogs
            required_env: RIFT_REQUIRE_REFLINK_TESTS
          - filesystem: zfs
            packages: zfsutils-linux
            required_env: RIFT_REQUIRE_REFLINK_TESTS
          - filesystem: xfs-no-reflink
            packages: xfsprogs
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
          - filesystem: ext4
            packages: e2fsprogs
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
          - filesystem: tmpfs
            packages: ""
            required_env: RIFT_REQUIRE_UNSUPPORTED_LINUX_TESTS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install filesystem tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${{ matrix.packages }}

      - name: Prepare filesystem and run tests
        run: |
          bash scripts/ci/linux-fs.sh "${{ matrix.filesystem }}" -- \
            env ${{ matrix.required_env }}=1 cargo test --package rift --package rift-cli --locked

  apfs-test:
    name: APFS integration tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests on APFS
        env:
          RIFT_REQUIRE_APFS_TESTS: "1"
        run: cargo test --package rift --locked

  windows-ntfs-test:
    name: Windows tests (NTFS)
    runs-on: windows-latest
    env:
      RIFT_REQUIRE_UNSUPPORTED_WINDOWS_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast -- --show-output

  refs:
    name: Windows tests (ReFS)
    runs-on: windows-2022
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      RIFT_REQUIRE_REFS_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Create a ReFS volume and copy the checkout onto it
        run: ./scripts/ci/windows-refs.ps1 -Volume E -CreatePartition

      - name: Run tests on ReFS
        working-directory: ${{ env.RIFT_CHECKOUT }}
        run: cargo test --package rift --package rift-cli --locked --no-fail-fast -- --show-output

  devdrive:
    name: Windows tests (Dev Drive)
    runs-on: windows-2025
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      RIFT_REQUIRE_REFS_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create a Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          drive-format: ReFS
          native-dev-drive: true
          trusted-dev-drive: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Copy the checkout onto the Dev Drive
        run: ./scripts/ci/windows-refs.ps1 -Volume $env:DEV_DRIVE

      - name: Run tests on the Dev Drive
        working-directory: ${{ env.RIFT_CHECKOUT }}
        run: cargo test --package rift --package rift-cli --locked --no-fail-fast -- --show-output
